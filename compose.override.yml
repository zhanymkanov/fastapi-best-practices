# 本地开发覆盖配置
# 用法: docker compose -f compose.yml -f compose.override.yml up -d

services:

  mongodb:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6380:6379"

  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    environment:
      - DEPLOY_MODE=dev
      - LOG_LEVEL=debug
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app:ro
